# Static site served inside the container on :80, with /api/ proxied to the bot.
# TLS is terminated by the edge nginx (makonbook-nginx), which proxies here.

# Trust the edge container so access logs show the real client IP.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 10.0.0.0/8;
real_ip_header   X-Forwarded-For;
real_ip_recursive on;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # text/html is always gzipped by nginx — listing it here only produces a duplicate-MIME warning.
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location ~* \.(jpg|jpeg|png|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Docker DNS + variable upstream: with a literal proxy_pass nginx resolves at
    # startup and refuses to boot while the bot is down, which would take the whole
    # site offline. The variable form resolves lazily and degrades to 502 instead.
    resolver 127.0.0.11 valid=30s;
    set $api_upstream http://sat-makon-bot:8000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
